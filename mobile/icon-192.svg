<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <circle cx="96" cy="96" r="64" fill="rgba(255, 255, 255, 0.08)" />
  <!-- Buzzer stylized button icon -->
  <circle cx="96" cy="96" r="48" fill="#ef4444" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
  <circle cx="96" cy="96" r="36" fill="#dc2626" />
  <!-- Letter Q and lightning bolt -->
  <text x="96" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">Ю</text>
</svg>
