<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <title>Город Ю — спасибо за участие</title>
  <style>
    :root {
      --bg: #0f1226;
      --bg-glow: #2b2f6b;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f2f3ff;
      --muted: #b9bce0;
      --accent: #ffd54a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5ff;
        --bg-glow: #d6d9ff;
        --card: rgba(255, 255, 255, 0.8);
        --border: rgba(30, 35, 90, 0.15);
        --text: #1a1d45;
        --muted: #4a4e85;
        --accent: #c47f00;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 0%, var(--bg-glow) 0%, var(--bg) 70%) fixed;
      -webkit-text-size-adjust: 100%;
    }
    main {
      width: 100%;
      max-width: 40rem;
      padding: clamp(1.5rem, 6vw, 3.5rem);
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: clamp(16px, 3vw, 28px);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .logo {
      margin: 0 0 1rem;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(1.6rem, 6vw, 2.75rem);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    p {
      margin: 0;
      font-size: clamp(1rem, 3.2vw, 1.35rem);
      line-height: 1.5;
      color: var(--muted);
    }
    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid currentColor;
      white-space: nowrap;
    }
    a:hover, a:focus-visible { opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Город Ю</div>
    <h1>Спасибо за участие в тестировании игры.</h1>
    <p>По любым вопросам обращайтесь к разработчику
      <a href="https://t.me/rmk_msk" rel="noopener">@rmk_msk</a>!</p>
  </main>
</body>
</html>
